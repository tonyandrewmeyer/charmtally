[project]
name = "charmtally"
version = "0.0.1"
description = "Scan a corpus of charms for feature adoption."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tony Meyer", email = "charmtally@aotearoa.dev" }]
keywords = ["juju", "charm", "ops", "pebble", "canonical"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pyyaml",
  "jinja2",
  "tomli ; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/tonyandrewmeyer/charmtally"
Issues = "https://github.com/tonyandrewmeyer/charmtally/issues"
Dashboard = "https://tonyandrewmeyer.github.io/charmtally/dashboard.html"

[project.scripts]
charmtally = "charmtally.cli:main"

[dependency-groups]
dev = [
  "codespell>=2.4.3",
  "ty>=0.0.69",
  "pre-commit>=4.6.1",
  "pytest>=9.1.1",
  "ruff>=0.16.1",
  "zizmor>=1.29.0",
  "pytest-cov>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["charmtally"]

[tool.pytest.ini_options]
testpaths = ["charmtally/tests"]

[tool.coverage.run]
source = ["charmtally"]
# Tests are ~half the lines and are 100% covered by construction; leaving them
# in put the total 7 points above the package's real figure.
omit = ["charmtally/tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
# The package sits at ~81%. The floor is a ratchet against erosion, not a
# target: raise it when the real figure moves, don't chase it with tests.
fail_under = 78

[tool.codespell]
ignore-words-list = "ths,re-uses"
# Generated artefacts, committed or not: scored.json and friends are
# gitignored but still sit in a working tree after a local run.
skip = "dashboard.html,trend.html,results.json,scored.json,llm-scored.json,pairs.json,uv.lock,snapshots"

[tool.ruff]
line-length = 99
target-version = "py310"
preview = true

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "N",
    "A",
    "UP",
    "YTT",
    "S",
    "B",
    "SIM",
    "RUF",
    "PERF",
    "D",
    "FA",
    "TC",
]
ignore = [
    "undocumented-magic-method",
    "undocumented-public-init",
    "incorrect-blank-line-before-class",
    "incorrect-blank-line-after-class",
    "multi-line-summary-second-line",
    "overindented-section-underline",
    "missing-trailing-period",
    "docstring-starts-with-this",
    "missing-new-line-after-section-name",
    "missing-dashed-underline-after-section",
    "missing-section-underline-after-name",
    "mismatched-section-underline-length",
    "missing-blank-line-after-last-section",
    # Method docstrings are not mandated; module/class/function docs are.
    "undocumented-public-method",
    # This tool deliberately shells out to juju/charmcraft/snap.
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
    # Prose uses real typography (en dashes, ×, curly quotes); these are
    # intentional, not homoglyph mistakes.
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    # __init__ resolves the installed version at import time.
    "non-empty-init-module",
    # This tool shells out to git/juju/charmcraft by design (see S603/S607).
    "float-equality-comparison",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.per-file-ignores]
"charmtally/llm_score.py" = ["line-too-long"]  # Embedded JSON prompt examples.
"charmtally/tests/*" = ["line-too-long"]  # Embedded charm-source fixtures.
"**/tests/**" = ["D", "assert", "hardcoded-password-string", "hardcoded-password-func-arg", "hardcoded-temp-file", "magic-value-comparison", "ARG", "private-member-access", "invalid-function-name", "invalid-argument-name", "non-lowercase-variable-in-function"]

[tool.ty.src]
# The package ships py.typed, so the annotations are a published interface
# and need checking. Tests are excluded: they build partial fixtures and
# pass deliberately-wrong values into protocols, and the noise from that
# would drown the signal from the package itself.
include = ["charmtally"]
exclude = ["charmtally/tests"]

[[tool.ty.overrides]]
# detectors/_config.py's tomllib/tomli shim needs a suppression on both imports, and
# whichever one the current interpreter *can* resolve then reports its
# suppression as unused — 3.10 dev envs and CI's 3.12 lint job disagree about
# which that is. See the comment on the try/except there.
include = ["charmtally/detectors/_config.py"]

[tool.ty.overrides.rules]
unused-ignore-comment = "ignore"
