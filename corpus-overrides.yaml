# Per-row overrides for the hyrum corpus, applied by `charmtally scan`.
#
# Four kinds of override:
#
#   exclude:             skip the row with a recorded reason. The reason is
#                        surfaced in results.json's __skipped__ block.
#   branch_overrides:    clone the named branch instead of the repo's default
#                        branch. Use for repos where the default branch is
#                        docs-only or otherwise doesn't contain charm code.
#   sub_charm_excludes:  for monorepos, skip specific sub-charms after fan-out.
#                        Use when a repo's CSV row points at one example charm
#                        but the repo also ships other sub-charms that aren't
#                        meant to be evaluated (e.g. test fixtures).
#   feature_excludes:    force a specific (charm, feature) pair to
#                        not-applicable. Use for known shim-charm FPs where
#                        the detector can't see through the abstraction
#                        (CALIBRATION #9). Optional `sub_path:` for monorepos.
#
# Sourced from non-roadmap/charmtally/CORPUS-TRIAGE.md §"not-a-charm",
# §"unreachable", §"scan-failure-other", and CALIBRATION.md §6 / §9.

exclude:
  # not-a-charm: upstream source mirror / bundle / non-charm repo
  - url: https://github.com/kubernetes/kubernetes
    reason: not-a-charm — upstream Kubernetes source mirror
  - url: https://github.com/canonical/etcd-operator
    reason: not-a-charm — no charmcraft.yaml/metadata.yaml at root or in charms/ subdirs
  - url: https://github.com/charmed-kubernetes/bundle
    reason: not-a-charm — bundle, not a charm
  - url: https://git.launchpad.net/landscape-client
    reason: not-a-charm — Landscape client source, not a charm
  - url: https://opendev.org/openstack/charm-neutron-api-odl
    reason: not-a-charm — abandoned ODL stub
  - url: https://opendev.org/openstack/charm-odl-controller
    reason: not-a-charm — abandoned ODL stub
  - url: https://opendev.org/openstack/charm-openvswitch-odl
    reason: not-a-charm — abandoned ODL stub
  - url: https://github.com/canonical/cos-coordinated-workers
    reason: "not-a-charm — PyPI library (`coordinated_workers`) shipping a decoy root charmcraft.yaml (`name: ceci-nest-pas-une-charm`); CALIBRATION #22 follow-up #8"
  - url: https://github.com/canonical/paas-charm-cli
    reason: "not-a-charm — the repo's actual product is src/paas_charm_cli/, a CLI tool for scaffolding and deploying paas_charm-based charms; app/charm and db-app/charm are the tool's own example fixtures (app/app.py an 8-line Flask \"Hello, world!\" toy, db-app/charm containing only a charmcraft.yaml with no src/ at all — no charm code to run), not deployed charms, and hyrum's charms.csv lists the repo with no Team and Source: auto-discover; CALIBRATION #47 Task 2 item 3"

  # not-a-charm: reactive build layers. A layer is a reusable component that
  # `charm build` merges into a charm; it is not itself deployable. Each is
  # self-declared: layer-basic and layer-beats-base ship a metadata.yaml
  # fragment with no `name:` at all, and the rest say so in their own
  # summary/description. Issue #112 sweep of the auto-discover pool.
  - url: https://github.com/canonical/layer-basic
    reason: "not-a-charm — reactive build layer (\"Base layer for building charms using the reactive pattern\"); metadata.yaml is the empty fragment `{}`, so there is no charm to deploy; issue #112"
  - url: https://github.com/canonical/layer-beats-base
    reason: "not-a-charm — reactive build layer, self-described as \"a middle layer, and not designed to be self deployable\"; metadata.yaml is a fragment with no `name:`; issue #112"
  - url: https://github.com/charmed-kubernetes/layer-coordinator
    reason: "not-a-charm — reactive build layer (\"Allows charms to easily coordinate critical operations among units in a service\"), layer.yaml header reads \"This file is part of the Coordinator Layer for Juju\"; issue #112"
  - url: https://github.com/charmed-kubernetes/layer-container-runtime-common
    reason: "not-a-charm — reactive build layer; its own metadata.yaml summary describes it as a layer holding common code across container runtimes, and the name it declares, `layer-container-runtime-common`, is not published on charmhub; issue #112"
  - url: https://github.com/charmed-kubernetes/layer-nagios
    reason: "not-a-charm — reactive build layer (\"Charm layer for relating to the cs:nrpe subordinate\"); metadata.yaml is a fragment with no `name:`; issue #112"
  - url: https://github.com/charmed-kubernetes/layer-kubernetes-node-base
    reason: "not-a-charm — reactive build layer (\"base layer for common code between kubernetes-control-plane and kubernetes-worker\"); metadata.yaml is a fragment with no `name:`; issue #112"
  - url: https://github.com/charmed-kubernetes/layer-kubernetes-master-worker-base
    reason: "not-a-charm — reactive build layer (\"Shared base layer for Kubernetes master and worker charms\"); metadata.yaml is a fragment with no `name:`; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/layer-openstack-api
    reason: "not-a-charm — reactive build layer; metadata.yaml summary is \"Reative Layer - OpenStack API charms\"; issue #112"

  # not-a-charm: test fixtures. Charms that exist to be deployed *against* a
  # charm under test, not to be run in anger. Issue #112 sweep of the
  # auto-discover pool; same shape as the benhoyt/test-charms sub-charms
  # already handled under sub_charm_excludes.
  - url: https://github.com/openstack-charmers/charm-arista-virt-test-fixture
    reason: "not-a-charm — test fixture for openstack-charmers integration tests (repo name); issue #112"
  - url: https://github.com/openstack-charmers/charm-kerberos-test-fixture
    reason: "not-a-charm — test fixture (\"Kerberos Test Fixture\"); issue #112"
  - url: https://github.com/openstack-charmers/charm-ldap-test-fixture
    reason: "not-a-charm — test fixture (\"Test fixture charm for LDAP integration testing\"); issue #112"
  - url: https://github.com/openstack-charmers/charm-ldap-test-fixture-k8s
    reason: "not-a-charm — test fixture, the k8s sibling of charm-ldap-test-fixture; issue #112"
  - url: https://github.com/openstack-charmers/charm-nfs-server-test-fixture
    reason: "not-a-charm — test fixture for openstack-charmers integration tests (repo name); issue #112"
  - url: https://github.com/openstack-charmers/charm-openidc-test-fixture
    reason: "not-a-charm — test fixture for openstack-charmers integration tests (repo name); issue #112"
  - url: https://github.com/openstack-charmers/test-charm-aodh-ch
    reason: "not-a-charm — repo description is \"DO NOT USE - Test charm repository for charmhub migration (reactive charm)\"; issue #112"
  # The eight hardening-* rows are four charms listed twice: `-tests` and
  # `-tests-charm` are separate Launchpad repos carrying the same
  # metadata.yaml `name:`, so the corpus double-counts each of them. All
  # eight say of themselves "is a charm for testing a charm".
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-apache-tests
    reason: "not-a-charm — test fixture; metadata.yaml summary is \"hardening-apache-tests is a charm for testing a charm\" against Hardening.io standards; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-apache-tests-charm
    reason: "not-a-charm — test fixture, and a duplicate: same metadata.yaml `name: hardening-apache-tests` as the row above; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-mysql-tests
    reason: "not-a-charm — test fixture; metadata.yaml summary is \"hardening-mysql-tests is a charm for testing a charm\"; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-mysql-tests-charm
    reason: "not-a-charm — test fixture, and a duplicate: same metadata.yaml `name: hardening-mysql-tests` as the row above; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-os-tests
    reason: "not-a-charm — test fixture; metadata.yaml summary is \"hardening-os-tests is a charm for testing a charm\"; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-os-tests-charm
    reason: "not-a-charm — test fixture, and a duplicate: same metadata.yaml `name: hardening-os-tests` as the row above; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-ssh-tests
    reason: "not-a-charm — test fixture; metadata.yaml summary is \"hardening-ssh-tests is a charm for testing a charm\"; issue #112"
  - url: https://git.launchpad.net/~openstack-charmers/charms/+source/hardening-ssh-tests-charm
    reason: "not-a-charm — test fixture, and a duplicate: same metadata.yaml `name: hardening-ssh-tests` as the row above; issue #112"

  # not-a-charm: boilerplate and demos — repos whose charm exists to be copied
  # or shown, not deployed. Issue #112 sweep of the auto-discover pool.
  - url: https://github.com/canonical/charmed-nodejs-boilerplate
    reason: "not-a-charm — boilerplate; the README calls it \"a robust foundation for building and deploying Node.js applications as Juju charms\", so charm/ is the template a user copies, alongside the app/ and rockcraft.yaml it templates; issue #112"
  - url: https://github.com/canonical/webteam-juju-demos-testing
    reason: "not-a-charm — repo description is \"Test repository for creating demos via Juju and Terraform\"; the charm/ directory wraps app.py, a Flask app whose only route returns \"Hello from a deployed Juju Demo!\"; issue #112"

  # not-a-charm: Cluster API providers. These are Go projects with no charm
  # code at all. They are in the corpus because auto-discovery matched a root
  # `metadata.yaml`, but theirs is the clusterctl provider manifest
  # (`apiVersion: clusterctl.cluster.x-k8s.io/v1alpha3`, `kind: Metadata`,
  # a `releaseSeries` list) — an unrelated schema that happens to share the
  # filename. Issue #112 sweep of the auto-discover pool.
  - url: https://github.com/canonical/cluster-api-k8s
    reason: "not-a-charm — Go Cluster API provider (\"Cluster API provider for Canonical Kubernetes\"); its metadata.yaml is the clusterctl provider manifest, not charm metadata; issue #112"
  - url: https://github.com/charmed-kubernetes/cluster-api-bootstrap-provider-charmed-k8s
    reason: "not-a-charm — Go Cluster API provider (\"A ClusterAPI bootstrap provider for Juju\"); its metadata.yaml is the clusterctl provider manifest, not charm metadata; issue #112"
  - url: https://github.com/charmed-kubernetes/cluster-api-control-plane-provider-charmed-k8s
    reason: "not-a-charm — Go Cluster API provider (\"A Cluster API control plane provider for Charmed Kubernetes\"); its metadata.yaml is the clusterctl provider manifest, not charm metadata; issue #112"
  - url: https://github.com/charmed-kubernetes/cluster-api-provider-juju
    reason: "not-a-charm — Go Cluster API provider (\"A ClusterAPI infrastructure provider for Juju\"); its metadata.yaml is the clusterctl provider manifest, not charm metadata; issue #112"

  # not-a-charm: playground.
  - url: https://github.com/canonical/apr-operator
    reason: "not-a-charm — repo description is \"Playground charm for Advanced Pattern Research\"; its README calls it \"a 'demo' charm repo for playing around with ideas on how to structure complex, large, real charms\", wrapping \"a tiny dice-rolling fastapi server\"; issue #112"

  # unreachable: git ls-remote failed
  - url: https://github.com/canonical/bundle-jupyter/issues/
    reason: unreachable — repo not found (URL is an issues-page link)
  - url: https://code.launchpad.net/landscape-bundles/+git
    reason: unreachable — repo not found
  - url: https://code.launchpad.net/~ubuntu-repository-cache-charmers/ubuntu-repository-cache/layer-ubuntu-repository-cache
    reason: unreachable — auth-required / 404
  - url: https://git.launchpad.net/charm-ovn-chassis
    reason: unreachable — auth-required / 404
  - url: https://git.launchpad.net/charm-ovn-dedicated-chassis
    reason: unreachable — auth-required / 404

branch_overrides:
  # mysql-* family: default branch is "readme" (docs-only); charm code lives on "main".
  - url: https://github.com/canonical/mysql-operator
    branch: main
  - url: https://github.com/canonical/mysql-k8s-operator
    branch: main
  - url: https://github.com/canonical/mysql-router-operator
    branch: main
  - url: https://github.com/canonical/mysql-router-k8s-operator
    branch: main

sub_charm_excludes:
  # benhoyt/test-charms is in the corpus as "webapp (example charm)" — the
  # webapp sub-charm is the documented example. The repo also ships three
  # minimal test fixtures (statustest, noticestest, database) that exercise
  # specific ops APIs and aren't meant to be migration targets.
  # Surfaced by CALIBRATION.md §6 (noticestest flagged as missing pebble-ready).
  - url: https://github.com/benhoyt/test-charms/
    sub_paths: [statustest, noticestest, database]
    reason: test fixture — not a production charm (only webapp is the example)

feature_excludes:
  # CALIBRATION #9: shim charms where the actual pebble-ready handler lives
  # outside the scanner's reach. Audited in rounds R2/R3 — kept off the
  # clear-gap list with a documented reason rather than continuing to flag
  # them every scan.
  - url: https://github.com/canonical/mongodb-k8s-operator
    features: [ops.pebble-ready]
    reason: shim — charm.py delegates to single_kernel_mongo.abstract_charm.AbstractMongoCharm; event wiring lives in the upstream library
  - url: https://github.com/canonical/mysql-router-operators
    sub_path: kubernetes
    features: [ops.pebble-ready]
    reason: reconcile-all pattern in sibling mysql-router-operators/common/abstract_charm.py — outside the sub-charm's src/, not visible to the per-charm scanner
