# Weekly corpus scan workflow
#
# What it does:
#   - Cron: 02:00 UTC every Monday (cheap; data moves slowly).
#   - workflow_dispatch: run on demand from the GH UI.
#   - Caches /tmp/charm-workdir between runs so we don't re-clone ~340
#     charms each scan. The corpus CSV itself is fetched fresh from
#     canonical/hyrum on every run (the upstream source); cache key
#     hashes corpus-overrides.yaml only (per-row pins are the only
#     locally-controlled axis).
#   - Runs the full pipeline: scan -> score -> dashboard + adoption.
#   - Writes a dated snapshot to snapshots/scored-YYYY-MM-DD.json for
#     the trend code. Snapshots stay uncompressed on purpose: consecutive
#     scans are near-identical text, which git deltas down to tens of KiB,
#     whereas gzipped snapshots would each be an opaque blob that cannot
#     delta at all.
#   - Commits the refreshed artefacts back to main if any changed.
#     scored.json / llm-scored.json / pairs.json are build intermediates
#     and deliberately not committed -- see .gitignore.

name: scan

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC
  workflow_dispatch:       # manual trigger from the GitHub UI
    inputs:
      llm_score:
        description: "Run the LLM scoring pass after rule-based scoring (uses OPENROUTER_API_KEY)"
        type: boolean
        default: false

# Single in-flight scan; queue any extras.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write          # need to commit the refreshed artefacts

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45    # cold-cache run takes ~30min; warm cache ~10min

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          enable-cache: true

      # Persist the charm clone tree across runs. Cache key is the
      # overrides hash — the corpus CSV is fetched fresh from
      # canonical/hyrum on every run and lives at workdir/corpus.csv
      # (re-clones are bounded by the per-row diff anyway).
      - name: Cache charm workdir
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /tmp/charm-workdir
          key: charm-workdir-${{ hashFiles('corpus-overrides.yaml') }}-${{ github.run_number }}
          restore-keys: |
            charm-workdir-${{ hashFiles('corpus-overrides.yaml') }}-
            charm-workdir-

      - name: Scan corpus
        run: |
          uv run charmtally scan \
            --workdir /tmp/charm-workdir \
            --overrides corpus-overrides.yaml \
            --out results.json

      - name: Score
        run: |
          uv run charmtally score \
            results.json \
            --overrides corpus-overrides.yaml \
            --out scored.json

      - name: LLM scoring pass
        if: ${{ inputs.llm_score == true }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run charmtally llm-score \
            scored.json \
            --workdir /tmp/charm-workdir \
            --cache-dir /tmp/charm-workdir/.llm-verdicts \
            --out llm-scored.json

      # The rocks half of the adoption scorecard's rootless metric. Written
      # into the scored file (not a separate artefact) so the dated snapshot
      # below carries it and the metric gets history for free. Rocks are
      # fetched, not cloned: rockcraft.yaml is all this reads.
      - name: Scan rocks
        run: |
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          uv run charmtally scan-rocks --rocks rocks.csv --into "$SCORED"

      # Feeds the dashboard's Pairs view. Without this the view rendered
      # empty on every published dashboard, because nothing ever produced
      # pairs.json and the dashboard step never passed --pairs.
      - name: Detect k8s/machine charm pairs
        run: |
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          uv run charmtally pairs "$SCORED" --out pairs.json

      - name: Render dashboard
        run: |
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          uv run charmtally dashboard \
            "$SCORED" --pairs pairs.json --out dashboard.html

      - name: Write dated snapshot
        run: |
          mkdir -p snapshots
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          cp "$SCORED" "snapshots/scored-$(date -u +%Y-%m-%d).json"

      - name: Render trend (History page)
        run: |
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          uv run charmtally trend \
            --snapshots-dir snapshots \
            --live "$SCORED" \
            --out trend.html

      - name: Render adoption scorecard
        run: |
          SCORED=scored.json
          if [ -f llm-scored.json ]; then SCORED=llm-scored.json; fi
          uv run charmtally adoption \
            --snapshots-dir snapshots \
            --live "$SCORED" \
            --out adoption.html

      - name: Commit refreshed artefacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name  "charmtally-bot"
          git config user.email "charmtally-bot@aotearoa.dev"
          git add results.json dashboard.html trend.html adoption.html snapshots/
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "scan: weekly corpus refresh $(date -u +%Y-%m-%d)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" HEAD:main
