#   delta bucket, rounds 34/38/39/47 ............ 38 TP / 47   exact
#   reconcile, the #21-#32 series figure ........ 94 TP / 116  exact
#   reconcile live bucket, #32 -> #45 ........... 120 TP / 133 exact
#
