#
# Source: canonical-work-queue `non-roadmap/feature-dashboard/CALIBRATION.md`
# (8,077 lines, ~48 audit rounds, 2026-06 to 2026-09-09), extracted 2026-09-10.
# The prose document remains authoritative: this file is a transcription of
# what it already says, not a re-adjudication. Nothing here was decided by
# reading a charm; every row cites the CALIBRATION.md line it came from.
#
# Why it exists: every round had to re-read prose to know which slugs were
# already adjudicated, nothing could regression-test the detectors against past
# verdicts, and a round could silently re-draw a slug an earlier round read.
# CALIBRATION #47 is the worked example of the last failure mode — #41 claimed
# `superset-k8s-operator` was unadjudicated when round 31 had given it a full
# TP row, and #42/#45/#46 repeated the claim for six weeks.
#
# The extraction write-up, including the reconciliation against the document's
# own cumulative figures and what this file deliberately cannot capture, is at
# canonical-work-queue `non-roadmap/feature-dashboard/LEDGER-EXTRACTION.md`.
#
# ---------------------------------------------------------------------------
# Schema
# ---------------------------------------------------------------------------
#
# A record is keyed on (slug, bucket), not on slug alone. A charm can be
# adjudicated separately in several buckets — `aproxy-operator` is a TP for the
# `clear-gap:ops.collect-status` bucket (round 2) and an FP for `reconcile`
# (round 26) — and those are two different questions with two different
# answers, not a contradiction.
#
#   slug            The charm as the scan output identifies it: a bare repo
#                   slug, or `<repo>/<sub-charm path>` for a monorepo. Rounds
#                   1-4 predate that convention and use informal display names
#                   (`Alertmanager`, `Microk8s`); those are transcribed as
#                   written rather than normalised — see the write-up.
#   bucket          What the round drew the charm from:
#                     reconcile | delta | reactive | component-graph
#                     clear-gap:<feature> | present:<feature>
#                     worth-considering:<feature> | corpus-membership
#   feature         The feature or detector the verdict is about, where the
#                   round names one; null where it doesn't.
#   verdict         TP | FP | NA | other | unadjudicated
#                     TP/FP        the round's own adjudication
#                     NA           the round judged the charm out of scope for
#                                  the feature (reactive charm, test fixture)
#                     other        a round-specific label outside TP/FP/NA;
#                                  `verdict_as_written` carries the wording
#                     unadjudicated the round named the charm but reached no
#                                  TP/FP verdict (sweep hit, sizing instance,
#                                  or an explicit "not adjudicated" note)
#   round           The round the current verdict comes from.
#   date            That round's date.
#   reason          One line quoted or closely paraphrased from that round.
#   source_line     Line number in CALIBRATION.md, at the 2026-09-10 revision.
#   verdict_as_written   The round's own wording, where it isn't a bare TP/FP.
#   history         Prior verdict events for the same (slug, bucket), oldest
#                   first. The top-level fields are the most recent event.
#
# Optional flags:
#   counts_toward_precision: false
#                   This event is NOT part of any round's own TP/FP tally —
#                   an inherited-twin verdict, a shape-sweep hit, or a
#                   sizing instance. Excluding these is what makes the
#                   document's cumulative figures reproduce exactly; a
#                   consumer computing precision must honour it.
#   inherited_from  The twin slug whose verdict this one inherits.
#   verdict_source_round
#                   The round that actually read the source, when a later
#                   round records the verdict by inheritance.
#   restates_round  An earlier round this row re-states rather than re-reads.
#   sample          Which draw the row came from, where the round names one.
#   superseded: true
#                   A claim a later round established was wrong. The only
#                   instances are #41/#42/#45/#46's "superset-k8s-operator is
#                   unadjudicated", corrected by #47.
#
# ---------------------------------------------------------------------------
# Reproduces (see LEDGER-EXTRACTION.md for the workings)
# ---------------------------------------------------------------------------
#   delta bucket, rounds 34/38/39/47 ............ 38 TP / 47   exact
#   reconcile, the #21-#32 series figure ........ 94 TP / 116  exact
#   reconcile live bucket, #32 -> #45 ........... 120 TP / 133 exact
#
