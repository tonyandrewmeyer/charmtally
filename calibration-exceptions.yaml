# Accepted divergences between `calibration-ledger.yaml` and the detectors.
#
# Read by `charmtally.tools.calibration_check`. Every entry silences exactly one
# (slug, bucket) row, in exactly one direction, and only while the ledger still
# records the verdict named in `ledger_verdict` — so correcting the ledger row
# (the other way to accept a change) invalidates the exception rather than
# quietly carrying it over.
#
# This is a known-defects list, not a suppression list. An entry needs a reason
# and a citation, and the check reports entries that have gone stale so the
# file shrinks as the gaps close.
#
# Fields:
#   slug, bucket     the ledger row this accepts
#   ledger_verdict   TP or FP, as the ledger currently records it
#   accepted         the date the divergence was accepted
#   reason           why the detector is right and the ledger row is not, or
#                    why the miscall is known and open
#   source           where to read the argument in full
#
# ---------------------------------------------------------------------------
# Group 1: a later round moved the charm between buckets.
#
# The ledger records what a round said about a charm, not which bucket the
# charm sat in at each weekly scan — LEDGER-EXTRACTION.md lists "bucket
# membership at a point in time" among the things it cannot capture. These two
# rows are the cases where that gap shows: the verdict stands, the charm has
# since moved, and both moves are recorded in CALIBRATION.md itself.
# ---------------------------------------------------------------------------
version: 1
exceptions:
  - slug: "charm-kube-virt"
    bucket: "reconcile"
    ledger_verdict: "TP"
    accepted: "2026-09-11"
    reason: >-
      Left the reconcile bucket before #27, which records the departure in its
      own dropout table: 13 slugs dropped out against the new 106-slug bucket,
      "12 of the 13 are FPs dropping out exactly as intended" and this is the
      thirteenth, listed as "TP* (flagged false-negative, follow-up #12)". #26
      had already flagged it that way — the two directly-observed handlers are
      cut-#1 relation-scoped shims delegating to a shared _merge_config, so
      cut #1 removes them and the charm-wide convergence underneath goes unseen.
      The detector matching nothing here is the known false negative follow-up
      #12 tracks, not a regression against #26's reading.
    source: "CALIBRATION.md:2196-2215 (#27 dropout table), CALIBRATION.md:1999 (#26)"

  - slug: "github-runner-operators/charms/planner-operator"
    bucket: "delta"
    ledger_verdict: "TP"
    accepted: "2026-09-11"
    reason: >-
      Correctly delta on the delta/reconcile axis when #38 read it (4 handlers,
      1 event each), and still is — no shared-handler pattern matches. It has
      since left the delta bucket the other way: #42 sized paas_charm
      corpus-wide and folded it into `component-graph` as that pattern's fourth
      member, detected by base class through each file's own import table. #43
      predicted this charm would move delta -> component-graph and #44's
      confirmation table ticks it. Since `delta` is the residual — no
      architecture pattern matched — any charm gaining its first pattern leaves
      it, and a delta verdict cannot survive that by construction.
    source: "CALIBRATION.md:6633 (#43 prediction), CALIBRATION.md:6858 (#44 confirmed)"

