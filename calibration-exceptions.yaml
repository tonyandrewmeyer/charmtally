  # The thirteen `reconcile` entries are exactly the thirteen false positives
  # behind LEDGER-EXTRACTION.md's live-bucket census of 120 TP / 133: the ten
  # survivors it names at #32, plus content-cache and valkey arriving at #40 and
  # juju-controller at #45. If that count moves, this list is the thing to
  # reconcile it against.
  # -------------------------------------------------------------------------
