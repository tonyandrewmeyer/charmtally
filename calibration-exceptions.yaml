  # An FP verdict says a human read the charm and judged the label wrong. It
  # does NOT say the detector was then fixed — several were, and those rows now
  # agree and need no entry here, but these have not been. Each one names the
  # follow-up that tracks it, so this list doubles as the open-gap tally.
